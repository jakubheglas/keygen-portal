[build]
  # ignore-scripts: wrangler/sharp postinstalls hang CI; Vite build does not need them
  command = "pnpm install --frozen-lockfile --ignore-scripts && pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
